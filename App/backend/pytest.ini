[pytest]
# Pytest configuration for 10S Card Game API

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test output options
addopts =
    -v
    --strict-markers
    --disable-warnings
    --tb=short

# Markers for test categorization
markers =
    auth: Authentication tests
    lobbies: Lobby management tests
    users: User endpoint tests
    games: Game endpoint tests
    slow: Slow running tests
    integration: Integration tests

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = src/tests

# Timeout for tests (in seconds)
timeout = 30

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
